<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCAMSHIELD AI - درع الحماية</title>
<style>
body{font-family:system-ui;background:#0f172a;color:white;text-align:center;padding:20px}
.card{background:white;color:#111;border-radius:20px;padding:20px;max-width:600px;margin:20px auto}
textarea{width:100%;height:120px;border-radius:12px;padding:12px;font-size:16px}
button{background:#2563eb;color:white;border:0;padding:14px 20px;border-radius:12px;font-size:18px;width:100%;margin-top:12px}
.result{margin-top:16px;padding:16px;border-radius:12px;font-weight:bold;font-size:20px}
.safe{background:#dcfce7;color:#166534}
.danger{background:#fee2e2;color:#991b1b}
.warn{background:#fef9c3;color:#854d0e}
.box{background:#f1f5f9;border-radius:12px;padding:12px;margin-top:12px;text-align:right}
</style>
</head>
<body>
<h1>🛡️ SCAMSHIELD AI</h1>
<p>درعك الذكي ضد النصب والاحتيال</p>
<div class="card">
<h2>افحصي أي رسالة مشبوهة</h2>
<textarea id="msg" placeholder="الصقي هنا رسالة الواتساب أو الرابط المشبوه... مثال: مبروك فزت بجائزة اضغط الرابط وادخل بياناتك"></textarea>
<button onclick="check()">🔍 افحص الآن</button>
<div id="out"></div>
<div class="box">
<b>علامات النصب:</b><br>
- يطلب منك فلوس أو بيانات بنك<br>
- يقول لك "مبروك فزت" أو "حسابك بيتقفل"<br>
- رابط غريب أو يطلب كود OTP<br>
- يستعجلك ويخوفك
</div>
</div>
<p>صُنع بواسطة رتاج 💜 لحماية عائلتنا</p>
<script>
function check(){
let t=document.getElementById('msg').value.toLowerCase();
let o=document.getElementById('out');
if(!t){o.innerHTML='<div class="result warn">الصقي رسالة أولاً</div>';return;}
let bad=['مبروك','فزت','جائزة','رابط','اضغط','حسابك','بيتقفل','otp','كود','بنك','بيانات','تحويل','فلوس','ارسل','http','خصم','عاجل','تم حظر'];
let n=bad.filter(w=>t.includes(w)).length;
if(n>=3){o.innerHTML='<div class="result danger">🚨 خطر جداً! 95% نصب<br>لا تضغطي الرابط ولا ترسلي أي بيانات</div>'}
else if(n>=1){o.innerHTML='<div class="result warn">⚠️ مشبوه! انتبهي<br>لا ترسلي بيانات ولا تضغطي الرابط</div>'}
else{o.innerHTML='<div class="result safe">✅ يبدو آمناً<br>بس خليكي حذرة دائماً</div>'}
}
</script>
</body>
</html>
